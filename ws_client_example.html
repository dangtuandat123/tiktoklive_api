<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Live Stream - WebSocket Gateway Dashboard</title>
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d27;
      --bg-card: rgba(30, 35, 48, 0.85);
      --accent: #fe2c55;
      --accent-glow: rgba(254, 44, 85, 0.35);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }
    .brand span {
      color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    button.btn-disconnect {
      background: #475569;
      box-shadow: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
    }
    .status-badge.online {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    main {
      flex: 1;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.15);
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .stats-bar strong {
      color: var(--text-main);
    }

    /* Chat Container */
    .chat-container {
      flex: 1;
      height: 520px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: fadeIn 0.2s ease-out;
      font-size: 14px;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: #334155;
    }

    .chat-body {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chat-author {
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-fan { background: #f43f5e; color: white; }
    .badge-mod { background: #10b981; color: white; }
    .badge-sub { background: #8b5cf6; color: white; }

    /* TikTok Shop Card */
    .shop-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .shop-product {
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .shop-thumb {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      background: #1e293b;
    }

    .shop-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .shop-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .shop-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-buy {
      display: inline-block;
      text-align: center;
      background: #fe2c55;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-buy:hover {
      background: #e02449;
    }

    /* Gift Feed */
    .gift-feed {
      height: 220px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gift-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(254, 44, 85, 0.08);
      border: 1px solid rgba(254, 44, 85, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .gift-name {
      font-weight: 700;
      color: #f43f5e;
    }
    .gift-combo {
      font-weight: 800;
      font-size: 15px;
      color: #fbbf24;
    }

    /* Caption Floating Bar */
    .caption-bar {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #38bdf8;
      min-height: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚡</span> TikTok Live Gateway
    </div>

    <div class="controls">
      <input type="text" id="serverHost" value="ws://localhost:8765" placeholder="ws://localhost:8765" style="width: 190px;">
      <input type="text" id="usernameInput" value="swatchesbybaobao" placeholder="Streamer username" style="width: 170px;">
      <button id="btnConnect" onclick="toggleConnect()">Kết Nối</button>
      <div id="statusBadge" class="status-badge">
        <span class="status-dot"></span> <span id="statusText">Chưa kết nối</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Left Column: Live Chat & AI Captions -->
    <div class="card">
      <div class="card-header">
        <span>💬 Bình Luận Trực Tiếp</span>
        <div class="stats-bar">
          <div>👥 Xem: <strong id="viewerCount">0</strong></div>
          <div>❤️ Tim: <strong id="likeCount">0</strong></div>
        </div>
      </div>
      <div id="chatBox" class="chat-container">
        <div style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 20px;">
          Đang chờ kết nối tới máy chủ WebSocket...
        </div>
      </div>
      <div class="caption-bar" id="captionBox">
        🎙️ <em>Phụ đề AI thời gian thực sẽ hiển thị tại đây khi streamer nói...</em>
      </div>
    </div>

    <!-- Right Column: TikTok Shop & Gifts -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <!-- Pinned Product -->
      <div class="card">
        <div class="card-header">
          <span>🛍️ Sản Phẩm Đang Ghim</span>
        </div>
        <div class="shop-card" id="shopCard">
          <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0;">
            Chưa có sản phẩm nào được ghim trong phòng live.
          </div>
        </div>
      </div>

      <!-- Gifts Feed -->
      <div class="card" style="flex: 1;">
        <div class="card-header">
          <span>🎁 Quà Tặng & Combo</span>
        </div>
        <div class="gift-feed" id="giftFeed">
          <div style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 30px;">
            Chưa có quà tặng nào.
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let socket = null;
    let isConnected = false;

    function toggleConnect() {
      if (isConnected) {
        if (socket) socket.close();
        return;
      }

      const host = document.getElementById("serverHost").value.trim();
      const user = document.getElementById("usernameInput").value.trim().replace(/^@/, '');
      if (!user) {
        alert("Vui lòng nhập Username của Streamer!");
        return;
      }

      const wsUrl = `${host}/live?username=${encodeURIComponent(user)}`;
      setStatus("connecting", "Đang kết nối...");
      document.getElementById("btnConnect").innerText = "Đang kết nối...";

      try {
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
          isConnected = true;
          setStatus("online", "Đang nhận dữ liệu");
          document.getElementById("btnConnect").innerText = "Ngắt Kết Nối";
          document.getElementById("btnConnect").classList.add("btn-disconnect");
          document.getElementById("chatBox").innerHTML = "";
          document.getElementById("giftFeed").innerHTML = "";
        };

        socket.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            handleLiveEvent(msg);
          } catch (e) {
            console.error("Lỗi parse JSON:", e);
          }
        };

        socket.onclose = () => {
          isConnected = false;
          setStatus("offline", "Đã ngắt kết nối");
          document.getElementById("btnConnect").innerText = "Kết Nối";
          document.getElementById("btnConnect").classList.remove("btn-disconnect");
        };

        socket.onerror = (err) => {
          console.error("Lỗi WebSocket:", err);
          setStatus("offline", "Lỗi máy chủ");
        };
      } catch (e) {
        alert("Không thể mở kết nối WebSocket: " + e.message);
        setStatus("offline", "Lỗi kết nối");
      }
    }

    function setStatus(state, text) {
      const badge = document.getElementById("statusBadge");
      const statusText = document.getElementById("statusText");
      badge.className = "status-badge " + (state === "online" ? "online" : "");
      statusText.innerText = text;
    }

    function handleLiveEvent(evt) {
      const type = evt.event;
      const data = evt.data || {};

      if (type === "chat") {
        appendChat(data);
      } else if (type === "gift") {
        appendGift(data);
      } else if (type === "like") {
        document.getElementById("likeCount").innerText = Number(data.total_like_count || 0).toLocaleString();
      } else if (type === "room_user_seq" || type === "join") {
        if (data.viewer_count) {
          document.getElementById("viewerCount").innerText = Number(data.viewer_count || 0).toLocaleString();
        }
      } else if (type === "oec_live_shopping") {
        updateShopProduct(data);
      } else if (type === "caption") {
        if (data.content) {
          document.getElementById("captionBox").innerHTML = `🎙️ <strong>${escapeHtml(data.content)}</strong>`;
        }
      }
    }

    function appendChat(data) {
      const u = data.user || {};
      const nick = u.nickname || "Ẩn danh";
      const comment = data.comment || "";
      const avatar = u.avatar_url || "https://p16-sign-va.tiktokcdn.com/tos-maliva-avt-0068/default.jpeg";

      let badgesHtml = "";
      if (u.fan_club && u.fan_club.name) {
        badgesHtml += `<span class="badge badge-fan">${escapeHtml(u.fan_club.name)} Lv.${u.fan_club.level}</span>`;
      }
      if (u.is_mod) badgesHtml += `<span class="badge badge-mod">MOD</span>`;
      if (u.is_sub) badgesHtml += `<span class="badge badge-sub">VIP</span>`;

      const chatBox = document.getElementById("chatBox");
      const msgDiv = document.createElement("div");
      msgDiv.className = "chat-msg";
      msgDiv.innerHTML = `
        <img class="chat-avatar" src="${escapeHtml(avatar)}" onerror="this.src='https://via.placeholder.com/32'">
        <div class="chat-body">
          <div class="chat-author">${badgesHtml} ${escapeHtml(nick)}</div>
          <div class="chat-text">${escapeHtml(comment)}</div>
        </div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendGift(data) {
      const u = data.user || {};
      const gift = data.gift || {};
      const combo = data.combo || {};

      const nick = u.nickname || "Khán giả";
      const giftName = gift.name || "Quà";
      const count = combo.event_gift_count || 1;
      const total = combo.total_gift_count || 1;

      const giftFeed = document.getElementById("giftFeed");
      const item = document.createElement("div");
      item.className = "gift-item";
      item.innerHTML = `
        <div><strong>${escapeHtml(nick)}</strong> tặng <span class="gift-name">${escapeHtml(giftName)}</span> (+${count})</div>
        <div class="gift-combo">x${total}</div>
      `;
      giftFeed.prepend(item);
      if (giftFeed.children.length > 20) giftFeed.removeChild(giftFeed.lastChild);
    }

    function updateShopProduct(data) {
      const card = document.getElementById("shopCard");
      const title = data.product_title || "Sản phẩm TikTok Shop";
      const img = data.product_image || "";
      const url = data.product_url || "#";
      const seller = data.seller || "";
      const sold = data.sold_count || "";

      card.innerHTML = `
        <div class="shop-product">
          ${img ? `<img class="shop-thumb" src="${escapeHtml(img)}" alt="Product">` : ''}
          <div class="shop-info">
            <div class="shop-title">${escapeHtml(title)}</div>
            <div class="shop-meta">
              ${seller ? `🏪 ${escapeHtml(seller)}<br>` : ''}
              ${sold ? `📈 ${escapeHtml(sold)}` : ''}
            </div>
          </div>
        </div>
        ${url && url !== '#' ? `<a class="btn-buy" href="${escapeHtml(url)}" target="_blank">🛒 Xem & Mua Sản Phẩm</a>` : ''}
      `;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }
  </script>
</body>
</html>
